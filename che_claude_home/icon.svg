<?xml version="1.0" encoding="UTF-8"?>
<!--
  CHE Claude in HomE Assistant — addon icon
  House silhouette with a small robot inside. Two-tone: indigo house, cyan robot,
  matches the mdi:home-heart aesthetic used by Family Control.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="houseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6cff"/>
      <stop offset="1" stop-color="#3f4bcc"/>
    </linearGradient>
    <linearGradient id="robotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee3ff"/>
      <stop offset="1" stop-color="#4ac1e6"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#e6e9fa"/>
    </radialGradient>
  </defs>

  <!-- rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>

  <!-- house silhouette: roof + body, rounded corners -->
  <path d="
      M 256 72
      L 448 232
      L 448 428
      Q 448 448 428 448
      L 84 448
      Q 64 448 64 428
      L 64 232
      Z"
    fill="url(#houseGrad)" />

  <!-- inner cutout for the room where the robot lives -->
  <rect x="120" y="248" width="272" height="176" rx="20" ry="20" fill="#f8f9ff"/>

  <!-- little robot body -->
  <g>
    <!-- antenna dot -->
    <circle cx="256" cy="264" r="8" fill="url(#robotGrad)"/>
    <!-- antenna stem -->
    <rect x="252" y="272" width="8" height="18" rx="2" fill="url(#robotGrad)"/>
    <!-- head -->
    <rect x="200" y="288" width="112" height="80" rx="18" ry="18" fill="url(#robotGrad)"/>
    <!-- eyes -->
    <circle cx="228" cy="322" r="8" fill="#1a2340"/>
    <circle cx="284" cy="322" r="8" fill="#1a2340"/>
    <!-- eye highlights -->
    <circle cx="230" cy="320" r="2.5" fill="#ffffff"/>
    <circle cx="286" cy="320" r="2.5" fill="#ffffff"/>
    <!-- mouth (little smile) -->
    <path d="M 240 348 Q 256 358 272 348" fill="none" stroke="#1a2340" stroke-width="5" stroke-linecap="round"/>
    <!-- body -->
    <rect x="188" y="374" width="136" height="52" rx="14" ry="14" fill="url(#robotGrad)"/>
    <!-- chest heart (nod to home-heart) -->
    <path d="
        M 256 400
        c -6 -8, -18 -8, -18 2
        c 0 8, 18 20, 18 20
        c 0 0, 18 -12, 18 -20
        c 0 -10, -12 -10, -18 -2 Z"
      fill="#ff6b8a"/>
  </g>
</svg>
