# tmux config for CHE Claude in HomE Assistant
# Baked defaults, not runtime-generated — so shells attach to a working config
# even before the first cont-init hook runs.

# Mouse mode on by default — the whole point of this addon vs the vanilla one.
# Scrollwheel works, clicking selects panes, dragging resizes them.
set -g mouse on

# 100k line history — enough to scroll through even a long Claude session
set -g history-limit 100000

# Escape time low so vim/claude feel responsive
set -g escape-time 20

# Numbering starts at 1 — easier to reach on keyboard
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal features so colors and italics look right
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Simple status bar — session name on the left, clock on the right
set -g status-bg colour235
set -g status-fg colour136
set -g status-left '[#S] '
set -g status-right '%H:%M %d-%b'
set -g status-left-length 30
