# tmux config for CHE Claude in HomE Assistant
# Baked defaults, not runtime-generated — so shells attach to a working config
# even before the first cont-init hook runs.
# cont-init.d/10-env.sh copies this to $HOME/.tmux.conf, which is where tmux
# actually reads it from (HOME=/data/home, not /root).

# ---------------------------------------------------------------------------
# Scrolling — the two settings below only work as a pair. Read before editing.
# ---------------------------------------------------------------------------
#
# By default tmux drives the outer terminal's *alternate screen*. xterm.js (what
# ttyd serves to the browser) gives the alternate screen no scrollback, and
# translates wheel events into arrow keys while it's active. In a Claude Code
# session that means scrolling up walks backwards through your own message
# history instead of scrolling the view — which is what 0.1.2 and 0.1.3 shipped.
#
# `smcup@:rmcup@` removes the alternate-screen capability from tmux's view of the
# terminal, so tmux writes into the normal buffer. xterm.js then owns the
# scrollback — 100k lines, passed via `--client-option scrollback=100000` in
# services.d/ttyd/run — and the wheel scrolls the page natively, with a real
# scrollbar.
#
# `mouse off` is required alongside it. With mouse on, tmux enables xterm mouse
# reporting and captures the wheel for its own copy-mode, so it never reaches
# xterm.js and the scrollback above goes unused.
#
# Neither setting works alone:
#   mouse off, alt screen on   → wheel becomes arrow keys (the 0.1.4-staged bug)
#   mouse on,  alt screen off  → wheel enters tmux copy-mode, a mode you must
#                                press q to leave; scrollbar never appears
#
# Cost of this pair: exiting or detaching tmux no longer restores the previous
# screen contents, and you lose click-to-focus-pane and drag-to-resize. Fair
# trade for scrolling that behaves the way anyone would expect in a browser.
#
# Keyboard copy-mode is unaffected: prefix (Ctrl+A) then [ , arrows/PageUp, q.
#
# Verify any change here by scrolling in an actual browser, not by reading the
# config back. This bug survived a full day of `tmux show-options` reporting
# everything was fine.
set -g mouse off
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'

# 100k line history — for tmux's own keyboard copy-mode.
set -g history-limit 100000

# Escape time low so vim/claude feel responsive
set -g escape-time 20

# Numbering starts at 1 — easier to reach on keyboard
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal features so colors and italics look right
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Simple status bar — session name on the left, clock on the right
set -g status-bg colour235
set -g status-fg colour136
set -g status-left '[#S] '
set -g status-right '%H:%M %d-%b'
set -g status-left-length 30
