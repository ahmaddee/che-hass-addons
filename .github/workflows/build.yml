---
name: Build CHE add-ons

on:
  push:
    branches: [main]
    paths:
      - "che_claude_home/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "che_claude_home/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.1.0). Leave empty for a dev build."
        required: false

env:
  BUILD_ARGS: "--test"

jobs:
  build:
    name: Build ${{ matrix.arch }} — che_claude_home
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, amd64, armv7]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get add-on version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            v=$(grep '^version:' che_claude_home/config.yaml | head -1 | awk -F'"' '{print $2}')
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.arch }}
        uses: home-assistant/builder@2025.09.0
        with:
          args: |
            ${{ github.event_name == 'pull_request' && '--test' || '' }} \
            --${{ matrix.arch }} \
            --target che_claude_home \
            --image "ahmaddee/{arch}-che_claude_home" \
            --docker-hub "ghcr.io" \
            --version "${{ steps.version.outputs.version }}"
